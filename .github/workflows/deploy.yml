# ==============================================================================
# Deploy Pipeline — Build Docker Images & Deploy to Azure VM
# ==============================================================================
# Responsibility: Build, push, and deploy to production.
# Triggered ONLY after CI passes on the main branch.
# ==============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build & Deploy to Azure VM
    runs-on: ubuntu-latest
    # Only run if CI succeeded AND it was a push (not a PR)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Lowercase repository name for Docker
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ---- Build & Push Docker Images ----

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:latest

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:latest

      # ---- Deploy to Azure VM ----

      - name: Copy infrastructure configs to Azure VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "infrastructure/"
          target: "~/app"

      - name: Deploy containers on Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.event.workflow_run.head_sha }} \
            FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.event.workflow_run.head_sha }} \
            sudo docker compose -f infrastructure/compose/prod.yml up -d --remove-orphans

            sudo docker image prune -af

      # ---- Post-Deploy Health Check ----

      - name: Health check — verify deployment
        run: |
          echo "⏳ Waiting 30 seconds for containers to start..."
          sleep 30
          echo "🔍 Checking health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.AZURE_VM_HOST }}/actuator/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "⚠️ Health check returned HTTP $STATUS (may still be starting up)"
            echo "   Check manually: http://${{ secrets.AZURE_VM_HOST }}/actuator/health"
          fi

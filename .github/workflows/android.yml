# ==============================================================================
# Android Build Pipeline — React Native (Seed)
# ==============================================================================
# Responsibility: Build Android APK and AAB for release.
# Triggered ONLY on release tags (v*).
#
# STATUS: Seed — requires a frontend-mobile/ project with React Native.
#
# Prerequisites:
#   1. Create frontend-mobile/ directory with React Native
#   2. Recommended setup: npx react-native init frontend-mobile
#   3. Uncomment the jobs below when ready
#
# Expected outputs (attached to GitHub Release):
#   - Android APK (for direct install / testing)
#   - Android AAB (for Google Play Store)
# ==============================================================================

name: Android Build

on:
  push:
    tags:
      - 'v*'

jobs:
  # ----------------------------------------------------
  # Seed: Uncomment when frontend-mobile/ project is ready
  # ----------------------------------------------------

  placeholder:
    name: Android Build (Not Configured)
    runs-on: ubuntu-latest
    steps:
      - name: Skip — Mobile project not set up yet
        run: |
          echo "ℹ️ Android build skipped."
          echo "   To enable: create a frontend-mobile/ project with React Native"
          echo "   and uncomment the build jobs in this workflow."


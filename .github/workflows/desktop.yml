# ==============================================================================
# Desktop Build Pipeline — Electron (Seed)
# ==============================================================================
# Responsibility: Build desktop installers for Windows, Linux, and macOS.
# Triggered ONLY on release tags (v*).
#
# STATUS: Seed — requires a desktop/ project with Electron to be set up.
#
# Prerequisites:
#   1. Create desktop/ directory with an Electron app
#   2. Recommended setup: npx create-electron-app desktop/
#   3. Or use electron-builder with your existing React frontend
#   4. Uncomment the jobs below when ready
#
# Expected outputs (attached to GitHub Release):
#   - Windows: .exe installer + .zip portable
#   - Linux:   .AppImage + .tar.gz
#   - macOS:   .dmg
# ==============================================================================

name: Desktop Build

on:
  push:
    tags:
      - 'v*'

jobs:
  # ----------------------------------------------------
  # Seed: Uncomment when desktop/ project is ready

# ==============================================================================
# CI/CD Pipeline — Build, Test & Deploy to Azure VM
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Test Java Spring Boot Backend
  # ----------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myproject_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Compile
        working-directory: backend
        run: ./mvnw compile -B -Dmaven.multiModuleProjectDirectory=.

      - name: Run unit tests
        working-directory: backend
        run: ./mvnw test -B -Dmaven.multiModuleProjectDirectory=.

      - name: Run integration tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: myproject_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: ./mvnw test -B -Dgroups=integration -Dmaven.multiModuleProjectDirectory=.

  # ----------------------------------------------------
  # Job 2: Build Docker Images & Deploy to Azure VM
  # ----------------------------------------------------
  deploy:
    name: Build Docker Images & Deploy to Azure VM
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name for Docker
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:latest

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:latest

      - name: Copy infrastructure configs to Azure VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "infrastructure/"
          target: "~/app"

      - name: Deploy containers on Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.sha }} \
            FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.sha }} \
            docker compose -f infrastructure/compose/prod.yml up -d --remove-orphans
            
            docker image prune -af

# ==============================================================================
# CI Pipeline — Build, Test & Quality Checks
# ==============================================================================
# Responsibility: Verify code quality ONLY. Does NOT deploy anything.
# Deployment is handled by deploy.yml (triggered after this succeeds on main).
# ==============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------
  # Job 1: Backend — Build, Test & Lint
  # ----------------------------------------------------
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myproject_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Compile
        working-directory: backend
        run: ./mvnw compile -B -Dmaven.multiModuleProjectDirectory=.

      - name: Run unit tests
        working-directory: backend
        run: ./mvnw test -B -Dmaven.multiModuleProjectDirectory=.

      - name: Run integration tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: myproject_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: ./mvnw test -B -Dgroups=integration -Dmaven.multiModuleProjectDirectory=.

  # ----------------------------------------------------
  # Job 2: Frontend — Lint & Type Check
  # ----------------------------------------------------
  frontend:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build (includes type-check via tsc)
        working-directory: frontend
        run: npm run build

# ==============================================================================
# Release Pipeline — Create GitHub Release with Artifacts
# ==============================================================================
# Responsibility: Build release artifacts and create a GitHub Release.
# Triggered ONLY when a version tag is pushed (e.g., v1.0.0).
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------
  # Job 1: Build Backend Release Artifacts
  # ----------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Build JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests -B -Dmaven.multiModuleProjectDirectory=.

      - name: Rename JAR for release
        run: |
          JAR_FILE=$(ls backend/target/*.jar | head -1)
          cp "$JAR_FILE" backend/target/backend-${{ github.ref_name }}.jar

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/backend-${{ github.ref_name }}.jar

  # ----------------------------------------------------
  # Job 2: Build Frontend Release Artifacts
  # ----------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Package frontend dist
        run: |
          cd frontend/dist
          zip -r ../../frontend-${{ github.ref_name }}.zip .

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-${{ github.ref_name }}.zip

  # ----------------------------------------------------
  # Job 3: Build Docker Images & Tag for Release
  # ----------------------------------------------------
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:latest

  # ----------------------------------------------------
  # Job 4: Create GitHub Release
  # ----------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-backend, build-frontend, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes generation

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./release-assets

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            ./release-assets/backend-${{ github.ref_name }}.jar
            ./release-assets/frontend-${{ github.ref_name }}.zip

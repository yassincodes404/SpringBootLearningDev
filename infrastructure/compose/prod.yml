# ==============================================================================
# Docker Compose — Production Environment
# ==============================================================================
# Full production stack: NGINX, Spring Boot, React, PostgreSQL
#
# Usage (from project root):
#   Start: docker compose --env-file .env.production -f infrastructure/compose/prod.yml up -d --build
#   Stop:  docker compose --env-file .env.production -f infrastructure/compose/prod.yml down
#
# Or simply: make prod-up / make prod-down
# ==============================================================================

services:

  # ---- NGINX Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: myproject-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # ---- Backend (Spring Boot) ----
  backend:
    image: ${BACKEND_IMAGE:-myproject-backend:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: myproject-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-myproject}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---- Frontend (React) ----
  frontend:
    image: ${FRONTEND_IMAGE:-myproject-frontend:latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: myproject-frontend
    restart: unless-stopped
    expose:
      - "80"

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: myproject-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-myproject}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-prod-data:
